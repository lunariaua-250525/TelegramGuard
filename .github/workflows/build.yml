name: Build TelegramGuard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract plugin source
        run: |
          unzip -o TelegramGuard-AVALOR-Paper-1.21.11-v1.1.0.zip

      - name: Build with Maven
        working-directory: TelegramGuard
        run: mvn -B clean package

      - name: Upload TelegramGuard JAR
        uses: actions/upload-artifact@v4
        with:
          name: TelegramGuard
          path: TelegramGuard/target/TelegramGuard.jar
