name: Build TelegramGuard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract plugin source
        run: |
          unzip -o TelegramGuard-Paper-1.21.11.zip
          cd TelegramGuard
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Build with Maven
        working-directory: ${{ env.PROJECT_DIR }}
        run: mvn -B clean package

      - name: Upload TelegramGuard JAR
        uses: actions/upload-artifact@v4
        with:
          name: TelegramGuard
          path: ${{ env.PROJECT_DIR }}/target/TelegramGuard.jar
